# Local development stack.
#
# This is what "Postgres" in AUDIT Phase 2 means in practice: one command to
# get the real database engine, rather than developing on SQLite and
# discovering the differences in production.
#
#   docker compose up -d db
#   DATABASE_URL=postgres://healthguard:healthguard@127.0.0.1:5432/healthguard \
#     python manage.py migrate

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: healthguard
      POSTGRES_USER: healthguard
      # Local development only. Production reads DATABASE_URL from the
      # environment and this file is not used there.
      POSTGRES_PASSWORD: healthguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthguard -d healthguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    # The env file lives with the backend, so it is named rather than picked up
    # implicitly: Compose only auto-reads a .env beside this file, and after the
    # split there is none there. A missing backend/.env fails the command with
    # the path in the message, which is the right kind of loud.
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "True"
      # Overrides whatever DATABASE_URL the env file carries: inside the network
      # the database is `db`, not 127.0.0.1.
      DATABASE_URL: postgres://healthguard:healthguard@db:5432/healthguard
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
